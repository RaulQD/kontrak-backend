services:
  db:
    image: postgres:16-alpine
    container_name: kontrak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: kontrak_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kontrak_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    container_name: kontrak_api
    restart: unless-stopped # igual que db: re-arranca solo, salvo que tu lo pares
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/kontrak_db
      # REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: kontrak_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-raul.g.quispe@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-1234}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
     db:
      condition: service_healthy
      
  # redis:
  #   image: redis:7-alpine
  #   container_name: kontrak_redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data
  #   command: ['redis-server', '--appendonly', 'yes']
  #   healthcheck:
  #     test: ['CMD', 'redis-cli', 'ping']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

volumes:
  postgres_data:
  pgadmin_data:
  # redis_data:
